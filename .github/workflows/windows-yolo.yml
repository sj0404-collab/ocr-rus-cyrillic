name: Windows YOLO Cyrillic detector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'training/**'
      - 'src/ocr_rus_cyrillic/yolo_detector.py'
      - '.github/workflows/windows-yolo.yml'

permissions:
  contents: read

jobs:
  train-yolo:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install YOLO training runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training\requirements.txt

      - name: Generate varied Russian synthetic dataset
        shell: pwsh
        run: |
          python training\synthetic_layout.py --samples 200 --output outputs\yolo_russian_synthetic --seed 20260821

      - name: Train and export YOLO detector
        shell: pwsh
        run: |
          python training\train_yolo.py --data outputs\yolo_russian_synthetic\dataset.yaml --output outputs\yolo_training --epochs 15 --imgsz 640 --batch 4

      - name: Upload dataset summary and detector
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-yolo-cyrillic-detector
          path: |
            outputs/yolo_russian_synthetic/dataset.yaml
            outputs/yolo_russian_synthetic/manifest.json
            outputs/yolo_training/**/weights/best.pt
            outputs/yolo_training/**/*.onnx
            outputs/yolo_training/**/*.png
            outputs/yolo_training/**/*.csv
          if-no-files-found: ignore
