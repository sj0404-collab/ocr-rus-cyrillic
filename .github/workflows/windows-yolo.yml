name: Windows YOLO Cyrillic detector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'training/**'
      - 'src/ocr_rus_cyrillic/yolo_detector.py'
      - '.github/workflows/windows-yolo.yml'

permissions:
  contents: read

jobs:
  train-yolo:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install YOLO training runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training\requirements.txt

      - name: Download and extract OpenCorpora Russian sentences
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "opencorpora-2025.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/mawo-ru/mawo-nlp-data/releases/download/v1.0.0/opencorpora-2025.tar.gz" -OutFile $archive
          python training\extract_opencorpora.py --archive $archive --output outputs\ru_corpus.txt --max-sentences 100000

      - name: Generate fully-labelled Russian manga OCR dataset
        shell: pwsh
        run: |
          python training\build_full_dataset.py --samples 400 --corpus outputs\ru_corpus.txt --art-dir benchmark\pollination_pages --output outputs\russian_manga_ocr_dataset --seed 20260822

      - name: Train and export YOLO detector on full labelled dataset
        shell: pwsh
        run: |
          python training\train_yolo.py --data outputs\russian_manga_ocr_dataset\dataset.yaml --output outputs\yolo_training --epochs 15 --imgsz 640 --batch 4

      - name: Upload dataset and detector
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-yolo-cyrillic-detector
          path: |
            outputs/ru_corpus.txt
            outputs/russian_manga_ocr_dataset/dataset.yaml
            outputs/russian_manga_ocr_dataset/manifest.json
            outputs/russian_manga_ocr_dataset/recognition/*.tsv
            outputs/russian_manga_ocr_dataset/images/**/*.jpg
            outputs/russian_manga_ocr_dataset/labels/**/*.txt
            outputs/yolo_training/**/weights/best.pt
            outputs/yolo_training/**/*.onnx
            outputs/yolo_training/**/*.png
            outputs/yolo_training/**/*.csv
          if-no-files-found: ignore
