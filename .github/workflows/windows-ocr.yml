name: Windows OCR benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'scripts/windows_smoke.py'
      - '.github/workflows/windows-ocr.yml'

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install OCR runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -m pytest -q

      - name: Run Windows OCR smoke test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python scripts\windows_smoke.py

      - name: Upload OCR result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ocr-smoke-result
          path: windows-smoke-result.json
          if-no-files-found: ignore
