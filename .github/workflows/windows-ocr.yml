name: Windows OCR benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'scripts/windows_smoke.py'
      - '.github/workflows/windows-ocr.yml'

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install OCR runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -m pytest -q

      - name: Run Windows OCR smoke test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python scripts\windows_smoke.py

      - name: Generate legal synthetic manga-style chapter
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python scripts\generate_manga_benchmark.py --pages 3 --output outputs\manga_synthetic

      - name: Scan every synthetic page and write CER report
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python scripts\evaluate_manga_benchmark.py --input outputs\manga_synthetic --output outputs\manga_synthetic_report.json

      - name: Scan every original AI-generated Russian manga page
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python scripts\evaluate_manga_benchmark.py --input benchmark\pollination_pages\final --output outputs\pollination_report.json

      - name: Upload OCR and chapter benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ocr-benchmark
          path: |
            windows-smoke-result.json
            outputs/manga_synthetic_report.json
            outputs/manga_synthetic/*.png
            outputs/pollination_report.json
            benchmark/pollination_pages/final/*.png
          if-no-files-found: ignore
